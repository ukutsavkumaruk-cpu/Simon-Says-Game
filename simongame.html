<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link  rel="stylesheet"  href="simonstyle.css">
</head>
<body>
    <div class="game">
        <h1>Simon Says Game</h1>
        <h3>Start the game</h3>
        <button id="start-btn">Start</button>
    </div>
    <div class="btn-container">
        <div class="line-1">
            <div class="btn" type="button" id="red">0th</div>
            <div class="btn" type="button" id="yellow">1st</div>
        </div>
        <div class="line-2">
            <div class="btn" type="button" id="green">2nd</div>
            <div class="btn" type="button" id="blue">3rd</div>
        </div>
    </div>

    <script src="simonjava.js"></script>
</body>
</html>
